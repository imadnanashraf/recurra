name: Study reminder

on:
  schedule:
    # Every hour at :30 UTC, which is on the hour in India (UTC+5:30).
    # Each person chooses their hours in Settings; the job only notifies at those hours.
    # GitHub may run scheduled jobs a few minutes late.
    - cron: '30 * * * *'
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reminder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node remind.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
