name: Push sender

# Deploys the free push sender (push/worker.js) to Cloudflare Workers, gives it the Firebase key,
# and tells the app its address (Firestore: public/config.pushUrl). Needs two repo secrets:
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see push/README.md). Without them it does nothing.
on:
  push:
    branches: [main]
    paths: ['push/**', '.github/workflows/push.yml']
  workflow_dispatch: {}

concurrency:
  group: push-sender
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare key
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF" ] || [ -z "$ACC" ]; then
            echo "::notice::Push sender not set up yet: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see push/README.md)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the worker
        if: steps.check.outputs.skip != '1'
        id: deploy
        working-directory: push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.17 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::No workers.dev address found. Open Cloudflare → Workers once to choose your free workers.dev subdomain, then run this job again."; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Give the worker the Firebase key
        if: steps.check.outputs.skip != '1'
        working-directory: push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" | npx --yes wrangler@3.114.17 secret put FIREBASE_SERVICE_ACCOUNT
      - name: Tell the app where the sender is
        if: steps.check.outputs.skip != '1'
        working-directory: reminder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUSH_URL: ${{ steps.deploy.outputs.url }}
        run: |
          npm install --no-audit --no-fund
          node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)) });
            admin.firestore().doc('public/config').set({ pushUrl: process.env.PUSH_URL, pushAt: Date.now() }, { merge: true }).then(() => console.log('pushUrl saved:', process.env.PUSH_URL));
          "
