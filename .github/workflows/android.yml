name: Build Android app

on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'scripts/**', 'templates/**', 'reminder/android-config.mjs', 'package.json', 'package-lock.json', 'capacitor.config.json', 'config.js', '.github/workflows/android.yml']
  workflow_dispatch: {}

permissions:
  contents: write   # to publish the APK as a download

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - name: Check signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets first (see README)."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/recurra.p12"
      - name: Firebase settings for Android (closed-app notifications)
        working-directory: reminder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install --no-audit --no-fund
          node android-config.mjs "$RUNNER_TEMP/google-services.json"
      - name: Prepare Android project
        env:
          GOOGLE_SERVICES_FILE: ${{ runner.temp }}/google-services.json
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/recurra.p12
        run: npm run android:prepare
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/recurra.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/recurra.apk"
      - name: App code for background updates (bundle.zip)
        run: cd www && zip -qr "$RUNNER_TEMP/bundle.zip" . && ls -la "$RUNNER_TEMP/bundle.zip"
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete android --yes --cleanup-tag || true
          gh release create android "$RUNNER_TEMP/recurra.apk" "$RUNNER_TEMP/bundle.zip" \
            --title "Recurra for Android $VERSION (build $RUN)" \
            --notes "Install: download recurra.apk on your Android phone and open it. Updates install over the old version; your data stays in your account." \
            --latest
      - name: Tell installed apps about this build
        working-directory: reminder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          LEVEL=$(node -p "require('../package.json').nativeLevel || 1")
          node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)) });
            const base = 'https://github.com/' + process.env.REPO + '/releases/download/android/';
            const android = { level: Number('$LEVEL'), build: Number(process.env.RUN), apk: base + 'recurra.apk', bundle: base + 'bundle.zip', at: Date.now() };
            admin.firestore().doc('public/config').set({ android }, { merge: true }).then(() => console.log('published', android));
          "
